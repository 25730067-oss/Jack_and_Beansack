<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비주얼 노벨 씬 플레이어</title>
    <style>
        /* 화면 전체를 배경으로 채우기 위한 기본 스타일 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Malgun Gothic', sans-serif;
        }

        /* 배경을 꽉 채우는 컨테이너 */
        #scene-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* 이미지 및 비디오 공통 스타일 (비율 유지하며 꽉 채움) */
        .bg-element {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* 기본적으로 숨김 */
        }

        .active {
            display: block; /* 활성화된 씬만 표시 */
        }

        /* 하단 컨트롤 버튼 */
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 2px solid #fff;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #fff;
            color: #000;
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="scene-container">
        <img id="bg-image" class="bg-element" src="" alt="배경 이미지">
        
        <video id="bg-video" class="bg-element" muted playsinline></video>

        <div id="controls">
            <button id="prev-btn" onclick="prevScene()">이전</button>
            <button id="next-btn" onclick="nextScene()">다음</button>
        </div>
    </div>

    <script>
        // 1. 깃허브 구조에 맞춘 씬 데이터 리스트 (타입과 경로 지정)
        const sceneList = [
            { type: 'video', src: 'video/Cover.mp4', loop: true }, // 표지 (반복 재생)
            { type: 'image', src: 'scene/S1.png' },
            { type: 'image', src: 'scene/S1_2.png' },
            { type: 'image', src: 'scene/S2.png' },
            { type: 'image', src: 'scene/S3.png' },
            { type: 'image', src: 'scene/S4_1.png' },
            { type: 'image', src: 'scene/S4_2.png' },
            { type: 'image', src: 'scene/S5.png' },
            { type: 'image', src: 'scene/S6.png' },
            { type: 'image', src: 'scene/S7.png' },
            { type: 'video', src: 'video/S8.mp4', loop: false },  // 씬 8 비디오 (1회 재생)
            { type: 'image', src: 'scene/S9.png' },
            { type: 'image', src: 'scene/S10.png' },
            { type: 'image', src: 'scene/S11_A.png' },
            { type: 'image', src: 'scene/S11_B.png' }
        ];

        let currentIdx = 0;

        const imgEl = document.getElementById('bg-image');
        const videoEl = document.getElementById('bg-video');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        // 2. 현재 인덱스에 맞춰 화면을 그려주는 함수
        function renderScene() {
            const currentScene = sceneList[currentIdx];

            // 버튼 비활성화 처리 (처음과 끝)
            prevBtn.disabled = currentIdx === 0;
            nextBtn.disabled = currentIdx === sceneList.length - 1;

            if (currentScene.type === 'image') {
                // 비디오 멈추고 숨기기
                videoEl.pause();
                videoEl.classList.remove('active');

                // 이미지 보여주기
                imgEl.src = currentScene.src;
                imgEl.classList.add('active');
            } 
            else if (currentScene.type === 'video') {
                // 이미지 숨기기
                imgEl.classList.remove('active');

                // 비디오 보여주고 재생하기
                videoEl.src = currentScene.src;
                videoEl.loop = currentScene.loop;
                videoEl.classList.add('active');
                
                // 브라우저 정책상 미디어는 사용자 상호작용(클릭 등) 후에만 autoplay가 안정적으로 작동합니다.
                videoEl.play().catch(error => {
                    console.log("비디오 자동 재생 차단됨 (클릭 필요):", error);
                });
            }
        }

        // 3. 버튼 이벤트 함수
        function nextScene() {
            if (currentIdx < sceneList.length - 1) {
                currentIdx++;
                renderScene();
            }
        }

        function prevScene() {
            if (currentIdx > 0) {
                currentIdx--;
                renderScene();
            }
        }

        // 첫 페이지 진입 시 초기화 실행
        window.onload = renderScene;
    </script>
</body>
</html>
