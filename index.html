<title>Abyss Zero</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    font-family:'Malgun Gothic', sans-serif;
    background:black;
    color:white;
}

/* 배경 */

#background{
    position:fixed;
    inset:0;
    z-index:0;
}

#background img,
#background video{
    width:100%;
    height:100%;
    object-fit:cover;

    position:absolute;

    inset:0;

}

/* 상태바 */

#statusBar{
    position:absolute;
    top:0;
    left:0;
    width:100%;

    padding:15px;

    background:rgba(0,0,0,.4);
    backdrop-filter:blur(10px);

    z-index:10;

    display:flex;
    flex-direction:column;
    align-items:center;
}

#sceneTitle{
    font-size:24px;
    font-weight:bold;

    margin-bottom:15px;

    text-align:center;
}

.stats{
    display:flex;
    gap:20px;
    align-items:center;
    margin-bottom:10px;
}

.stat{
    display:flex;
    align-items:center;
    gap:8px;
}

.gauge{
    width:140px;
    height:12px;

    border:1px solid white;
    border-radius:20px;

    overflow:hidden;
}

.fill{
    height:100%;
    width:50%;

    background:#ffe600;

    transition:.5s;
}

#money{
    font-size:18px;
}

/* 멀티 UI */

#uiLayer{
    position:absolute;
    bottom:180px;
    left:50%;
    transform:translateX(-50%);

    width:80%;
    min-height:120px;

    z-index:20;
}

/* 대사창 */

#dialogueBox{
    position:absolute;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    width:75%;
    height:160px;

    background:rgba(255,255,0,.15);

    backdrop-filter:blur(10px);

    border:2px solid #ffe600;

    padding:10px 15px;

    z-index:30;
}

#speaker{
    font-size:20px;
    font-weight:bold;
    color:#ffe600;

    margin-bottom:10px;
}

#dialogue{
    line-height:1.6;
}

/* 선택지 버튼 스타일*/
.choiceBtn{

    display:block;

    width:100%;

    margin:10px 0;

    padding:15px;

    font-size:18px;

    color:white;

    background:rgba(255,255,0,.15);

    border:1px solid #ffe600;

    cursor:pointer;

    backdrop-filter:blur(10px);

}

.choiceBtn:disabled{

    opacity:0.4;

    cursor:not-allowed;

    transform:none;

}

.choiceBtn:hover{

    transform:scale(1.02);

}

#uiLayer{

    position:absolute;

    bottom:180px;

    left:50%;

    transform:translateX(-50%);

    width:80%;

    min-height:120px;

    display:flex;

    justify-content:center;

    align-items:center;

    z-index:20;
}

#profileImage{

    width:180px;

    height:auto;

    border-radius:12px;

    border:2px solid #ffe600;

    backdrop-filter:blur(10px);

    box-shadow:0 0 15px rgba(255,230,0,.8);

}

/* 화면 흔들림 */

.shake{

    animation: shakeEffect .5s;

}

@keyframes shakeEffect{

    0%{transform:translate(0);}
    20%{transform:translate(-8px,5px);}
    40%{transform:translate(8px,-5px);}
    60%{transform:translate(-8px,5px);}
    80%{transform:translate(8px,-5px);}
    100%{transform:translate(0);}
}

/* 전체 블러 */

.blur{

    filter:blur(6px);

}

/* 가장자리만 블러 */

.slight-blur{

    mask-image:radial-gradient(
        circle,
        black 60%,
        transparent 100%
    );

    filter:blur(4px);

/* pin 표시 */
.pinBox{

    gap:10px;

    align-items:center;

.pinInput{

    color:white;

    border:1px solid #fff;
}

.pinButton{

    padding:12px 24px;

    cursor:pointer;

    font-size:18px;
}

</style>

//랜덤 pin 생성
function generatePIN(){

    return Math.floor(
        1000 + Math.random()*9000
    ).toString();

}

//pin 화면
function showPINGame(successScene, failScene){

    const uiLayer =
        document.getElementById("uiLayer");

    currentPIN = generatePIN();

    uiLayer.innerHTML = `

        <div class="pinBox">

            <div>
                PIN :
                <strong>${currentPIN}</strong>
            </div>

            <input
                id="pinInput"
                class="pinInput"
                maxlength="4">

            <button
                id="pinSubmit"
                class="pinButton">

                확인

            </button>

        </div>

    `;

    document
        .getElementById("pinSubmit")
        .onclick = ()=>{

            document
                .getElementById("pinSubmit")
                .addEventListener("click",(e)=>{

                    e.stopPropagation();

                });

            const value =
                document
                .getElementById("pinInput")
                .value;
            
            document
                .getElementById("pinInput")
                .addEventListener("click",(e)=>{

                    e.stopPropagation();

                });

            if(value === currentPIN){

                state.C += 80;

                updateStats();

                uiLayer.innerHTML="";

                loadScene(successScene);

            }

            else{

                alert(
                    "전류 과부하. 다시 시도하십시오."
                );

                uiLayer.innerHTML="";

                loadScene(failScene);

            }

        };

}

//이팩트
const backgroundContainer =
    document.getElementById("background");

function applyEffect(effect){

    backgroundContainer.classList.remove(
        "shake",
        "blur",
        "slight-blur"
    );

    if(!effect) return;

    switch(effect){

        case "shake":

            backgroundContainer.classList.add(
                "shake"
            );

            setTimeout(()=>{

                backgroundContainer.classList.remove(
                    "shake"
                );

            },500);

            break;

        case "blur":

            backgroundContainer.classList.add(
                "blur"
            );

            break;

        case "slight_blur":

            backgroundContainer.classList.add(
                "slight-blur"
            );

            break;
    }
}

//조건 검사
function checkCondition(condition){

    if(!condition) return null;

    const currentValue =
        state[condition.stat];

    switch(condition.operator){

        case ">=":

            return currentValue >=
                condition.value;

        case ">":

            return currentValue >
                condition.value;

        case "<=":

            return currentValue <=
                condition.value;

        case "<":

            return currentValue <
                condition.value;

        case "==":

            return currentValue ==
                condition.value;
    }

    return false;
}

const mText =

const cFill =
    document.getElementById("cFill");

const oFill =
    document.getElementById("oFill");


    //상태바 업데이트
function updateStats(){

    hText.textContent =
        `H (${state.H})`;

    cText.textContent =
        `C (${state.C})`;

    oText.textContent =
        `O (${state.O})`;

    mText.textContent =
        `M (${state.M.toLocaleString()} Cr)`;

    hFill.style.width =
        `${state.H}%`;

    cFill.style.width =
        `${state.C}%`;

    oFill.style.width =
        `${state.O}%`;

}

//스탯 적용
function applyEffects(effects){

    if(!effects) return;

    Object.keys(effects).forEach(key=>{

        state[key] += effects[key];

        if(state[key] < 0){

            state[key] = 0;

        }

    });

    updateStats();

}

//골드디거
function useGoldDigger(){

    while(state.C < 90){

        state.C += 10;

        state.H -= 5;

        state.M -= 10000;

        if(state.H < 0){
            state.H = 0;
        }

        if(state.M < 0){
            state.M = 0;
        }
    }

    updateStats();
}

function canSelect(choice){

    if(choice.reqH &&
       state.H < choice.reqH){

        return false;

    }

    if(choice.reqC &&
       state.C < choice.reqC){

        return false;

    }

    if(choice.reqO &&
       state.O < choice.reqO){

        return false;

    }

    if(

        choice.emotional === true
        &&
        state.C < 30

    ){

        return false;

    }

    return true;

}

//선택지 UI
function showChoices(choices){

    const uiLayer =
        document.getElementById("uiLayer");

    uiLayer.innerHTML = "";

    choices.forEach(choice=>{

        const btn =
            document.createElement("button");

        btn.className = "choiceBtn";

        btn.textContent =
            choice.text;

        if(!canSelect(choice)){

            btn.disabled = true;

        }   

        btn.onclick = ()=>{

            applyEffects(choice.effects);

            if(choice.goldDigger){

                useGoldDigger();

            }

            uiLayer.innerHTML = "";

            loadScene(choice.next);

        };

        uiLayer.appendChild(btn);

    });

}

let currentScene = "S1A";

let dialogueIndex = 0;

let typing = false;

let typingTimer;


const speakerEl =
    document.getElementById("speaker");

const dialogueEl =
    document.getElementById("dialogue");

const sceneTitle =
    document.getElementById("sceneTitle");

const bgImage =
    document.getElementById("bgImage");

const bgVideo =
    document.getElementById("bgVideo");


function loadScene(sceneId){

    currentScene = sceneId;

    dialogueIndex = 0;

    const scene = scenes[sceneId];

    if(scene.profile){

        profileImage.src =
            profiles[scene.profile];

        profileImage.style.display =
            "block";

    }
    else{

        profileImage.style.display =
            "none";

    }

    if(scene.onEnter){

        scene.onEnter();

    }

    sceneTitle.textContent =
        scene.title;

    changeBackground(
        scene.background
    );

    applyEffect(
        scene.effect
    );

    showDialogue();

}

//배경 변경 함수
function changeBackground(path){

    if(path.endsWith(".mp4")){

        bgImage.style.display = "none";

        bgVideo.style.display = "block";

        bgVideo.src = path;

        bgVideo.play();

    }

    else{

        bgVideo.pause();

        bgVideo.style.display = "none";

        bgImage.style.display = "block";

        bgImage.src = path;

    }

}

function typeWriter(text){

    dialogueEl.textContent="";

    let i=0;

    typing=true;

    typingTimer = setInterval(()=>{

        dialogueEl.textContent += text[i];

        i++;

        if(i >= text.length){

            clearInterval(typingTimer);

            typing=false;

        }

    },30);

}

function showDialogue(){

    const scene =
        scenes[currentScene];

    const line =
        scene.dialogues[dialogueIndex];

    speakerEl.textContent =
        line.speaker;

    typeWriter(line.text);

}

document.addEventListener("click",(e)=>{

    if(
        e.target.id === "pinInput" ||
        e.target.id === "pinSubmit"
    ){
        return;
    }

    const scene =
        scenes[currentScene];

    if(typing){

        clearInterval(typingTimer);

        dialogueEl.textContent =
            scene.dialogues[dialogueIndex].text;

        typing = false;

        return;
    }

    dialogueIndex++;

    if(dialogueIndex >= scene.dialogues.length){

        if(scene.choices){

            showChoices(scene.choices);

        }

        else if(scene.condition){

            const result =
                checkCondition(
                    scene.condition
                );

            loadScene(

                result
                ? scene.condition.trueScene
                : scene.condition.falseScene

            );

        }

        else if(scene.next){

            loadScene(scene.next);

        }

        if(currentScene === "S3_PIN"){

            showPINGame(
                "S4",
                "S3"
            );

            return;
        }

        return;
    }

    showDialogue();

});

updateStats();
