<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abyss Zero</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    font-family:'Malgun Gothic', sans-serif;
    background:black;
    color:white;
}

/* 배경 */

#background{
    position:fixed;
    inset:0;
    z-index:0;
}

#background img,
#background video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* 상태바 */

#statusBar{
    position:absolute;
    top:0;
    left:0;
    width:100%;

    padding:15px;

    background:rgba(0,0,0,.4);
    backdrop-filter:blur(10px);

    z-index:10;

    display:flex;
    flex-direction:column;
    align-items:center;
}

#sceneTitle{
    font-size:24px;
    font-weight:bold;

    margin-bottom:15px;

    text-align:center;
}

.stats{
    display:flex;
    gap:20px;
    align-items:center;
    margin-bottom:10px;
}

.stat{
    display:flex;
    align-items:center;
    gap:8px;
}

.gauge{
    width:140px;
    height:12px;

    border:1px solid white;
    border-radius:20px;

    overflow:hidden;
}

.fill{
    height:100%;
    width:50%;

    background:#ffe600;

    transition:.5s;
}

#money{
    font-size:18px;
}

/* 멀티 UI */

#uiLayer{
    position:absolute;
    bottom:180px;
    left:50%;
    transform:translateX(-50%);

    width:80%;
    min-height:120px;

    z-index:20;
}

/* 대사창 */

#dialogueBox{
    position:absolute;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    width:75%;
    height:160px;

    background:rgba(255,255,0,.15);

    backdrop-filter:blur(10px);

    border:2px solid #ffe600;

    padding:10px 15px;

    z-index:30;
}

#speaker{
    font-size:20px;
    font-weight:bold;
    color:#ffe600;

    margin-bottom:10px;
}

#dialogue{
    line-height:1.6;
}

/* 선택지 버튼 스타일*/
.choiceBtn{

    display:block;

    width:100%;

    margin:10px 0;

    padding:15px;

    font-size:18px;

    color:white;

    background:rgba(255,255,0,.15);

    border:1px solid #ffe600;

    cursor:pointer;

    backdrop-filter:blur(10px);

}

.choiceBtn:hover{

    transform:scale(1.02);

}

#uiLayer{

    position:absolute;

    bottom:180px;

    left:50%;

    transform:translateX(-50%);

    width:80%;

    min-height:120px;

    display:flex;

    justify-content:center;

    align-items:center;

    z-index:20;
}

#profileImage{

    width:180px;

    height:auto;

    border-radius:12px;

    border:2px solid #ffe600;

    backdrop-filter:blur(10px);

    box-shadow:0 0 15px rgba(255,230,0,.8);

}

</style>
</head>
<body>

<div id="background">
    <img src="./background/셀레스티얼_복도.png">
</div>

<header id="statusBar">

    <div id="sceneTitle">
        추락 : 에이스의 말로
    </div>

<div class="stats">

    <div class="stat">

        <span id="hText">
            H (50)
        </span>

        <div class="gauge">
            <div id="hFill" class="fill"></div>
        </div>

    </div>

    <div class="stat">

        <span id="cText">
            C (95)
        </span>

        <div class="gauge">
            <div id="cFill" class="fill"></div>
        </div>

    </div>  

    <div class="stat">

        <span id="oText">
            O (100)
        </span>

        <div class="gauge">
            <div id="oFill" class="fill"></div>
        </div>

    </div>

    <div class="stat">

        <span id="mText">
            M (1,000,000 Cr)
        </span>

    </div>

</div>
</header>

<div id="uiLayer">

    <img
        id="profileImage"
        src=""
        style="display:none;"
    >

</div>

<div id="dialogueBox">

    <div id="speaker"></div>
    <div id="dialogue"></div>

</div>

<script>

//프로필 이미지
const profileImage =
document.getElementById("profileImage");

//프로필 표시
function updateProfile(speaker){

    if(profiles[speaker]){

        profileImage.src =
            profiles[speaker];

        profileImage.style.display =
            "block";

    }
    else{

        profileImage.style.display =
            "none";

    }

}

//상태바 초기값
const state = {

    H:50,

    C:95,

    O:100,

    M:1000000

};

//상태바 연결
const hText =
    document.getElementById("hText");

const cText =
    document.getElementById("cText");

const oText =
    document.getElementById("oText");

const mText =
    document.getElementById("mText");

const hFill =
    document.getElementById("hFill");

const cFill =
    document.getElementById("cFill");

const oFill =
    document.getElementById("oFill");


    //상태바 업데이트
function updateStats(){

    hText.textContent =
        `H (${state.H})`;

    cText.textContent =
        `C (${state.C})`;

    oText.textContent =
        `O (${state.O})`;

    mText.textContent =
        `M (${state.M.toLocaleString()} Cr)`;

    hFill.style.width =
        `${state.H}%`;

    cFill.style.width =
        `${state.C}%`;

    oFill.style.width =
        `${state.O}%`;

}

//스탯 적용
function applyEffects(effects){

    if(!effects) return;

    Object.keys(effects).forEach(key=>{

        state[key] += effects[key];

        if(state[key] < 0){

            state[key] = 0;

        }

    });

    updateStats();

}

//선택지 UI
function showChoices(choices){

    const uiLayer =
        document.getElementById("uiLayer");

    uiLayer.innerHTML = "";

    choices.forEach(choice=>{

        const btn =
            document.createElement("button");

        btn.className = "choiceBtn";

        btn.textContent =
            choice.text;

        btn.onclick = ()=>{

            applyEffects(choice.effects);

            uiLayer.innerHTML = "";

            loadScene(choice.next);

        };

        uiLayer.appendChild(btn);

    });

}

//프로필
const profiles = {

    "잭":"./profile/Jack_P.png",

    "스카이":"./profile/Sky_P.png"

};

//씬
const scenes = {

    S1:{
        title:"추락 : 에이스의 말로",

        background:"./background/셀레스티얼_복도.png",

        next:"S2",

        dialogues:[

            {
                speaker:"나레이션",
                text:"찬란한 하늘의 초호화 도시 셀레스티얼"
            },

            {
                speaker:"커스터디언",
                text:"놓치면 안된다 잡아라!!"
            },

            {
                speaker:"잭",
                text:"이게 도대체 무슨 일인가.."
            }

        ]
    },

    S2:{
        title:"회상 : 기억의 파편",

        background:"./scene/S2.png",

        next:null,

        dialogues:[

            {
                speaker:"나레이션",
                text:"추락의 충격으로 잭은 잠시 의식을 잃었다."
            },

            {
                speaker:"잭",
                text:"내가 왜 이렇게 된거지..."
            }

        ],

        choices:[

            {
                text:"나는 결백하다.",

                effects:{
                    H:5
                },

                next:"S3"
            },

            {
                text:"분노를 억누르지 못한다.",

                effects:{
                    H:-10
                },

                next:"S3"
            }

        ]
    }

};

let currentScene = "S1";

let dialogueIndex = 0;

let typing = false;

let typingTimer;

const speakerEl =
    document.getElementById("speaker");

const dialogueEl =
    document.getElementById("dialogue");

const sceneTitle =
    document.getElementById("sceneTitle");

const bgImage =
    document.querySelector("#background img");

function loadScene(sceneId){

    currentScene = sceneId;

    dialogueIndex = 0;

    const scene = scenes[sceneId];

    sceneTitle.textContent =
        scene.title;

    bgImage.src =
        scene.background;

    showDialogue();

}

function typeWriter(text){

    dialogueEl.textContent="";

    let i=0;

    typing=true;

    typingTimer = setInterval(()=>{

        dialogueEl.textContent += text[i];

        i++;

        if(i >= text.length){

            clearInterval(typingTimer);

            typing=false;

        }

    },30);

}

function showDialogue(){

    const scene =
        scenes[currentScene];

    const line =
        scene.dialogues[dialogueIndex];

    speakerEl.textContent =
        line.speaker;
        updateProfile(line.speaker);

    typeWriter(line.text);

}

document.addEventListener("click",()=>{

    const scene =
        scenes[currentScene];

    if(typing){

        clearInterval(typingTimer);

        dialogueEl.textContent =
            scene.dialogues[dialogueIndex].text;

        typing=false;

        return;
    }

    dialogueIndex++;

    if(dialogueIndex >= scene.dialogues.length){

        if(dialogueIndex >= scene.dialogues.length){

            if(scene.choices){

                showChoices(scene.choices);

            }

            else if(scene.next){

                loadScene(scene.next);

            }

            return;

        }

        return;
    }

    showDialogue();

});

updateStats();

loadScene("S1");

</script>

</body>
</html>
