<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>잭과 콩나무 - 어비스 제로</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

    <style>
        :root {
            --neon-pink: #ff007f;
            --neon-yellow: #fff200;
            --neon-cyan: #00f3ff;
            --bg-dark: rgba(10, 2, 8, 0.85);
            --text-main: #f0e6eb;
            --glitch-red: #ff1111;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Pretendard', sans-serif;
            background-color: #000; overflow: hidden; color: var(--text-main);
            user-select: none;
        }

        /* 1. 배경 이미지 레이어 */
        #bg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            transition: background-image 0.5s ease-in-out; z-index: 1;
        }

        /* 2. 상단 타이틀 */
        #header {
            position: absolute; top: 0; left: 0; width: 100%;
            background: rgba(0, 0, 0, 0.9); padding: 15px 0;
            text-align: center; border-bottom: 2px solid var(--neon-yellow);
            z-index: 10;
        }
        #header h1 {
            margin: 0; font-family: 'Nanum Myeongjo', serif; font-size: 1.5rem;
            color: var(--neon-yellow); text-shadow: 0 0 10px var(--neon-yellow);
        }

        /* 3. 중앙 등장인물 (가상 플레이스홀더) */
        #char-layer {
            position: absolute; bottom: 30vh; width: 100%;
            display: flex; justify-content: center; gap: 50px; z-index: 5;
        }
        .character-bust {
            width: 200px; height: 300px;
            background: linear-gradient(to top, rgba(255,0,127,0.3), transparent);
            border: 2px solid var(--neon-pink); border-bottom: none;
            display: flex; align-items: flex-end; justify-content: center;
            padding-bottom: 20px; font-weight: bold; font-size: 1.2rem;
            transition: all 0.3s; opacity: 0; transform: translateY(20px);
        }
        .character-bust.active { opacity: 1; transform: translateY(0); filter: brightness(1); border-color: var(--neon-cyan); box-shadow: 0 0 15px var(--neon-cyan); }
        .character-bust.dimmed { opacity: 0.7; transform: translateY(0); filter: brightness(0.4) grayscale(0.5); border-color: #555; }

        /* 4. 하단 대화창 및 선택지 */
        #dialogue-layer {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 80%; min-height: 25vh;
            background: linear-gradient(to bottom, rgba(5, 0, 2, 0.6), rgba(5, 0, 2, 0.95));
            backdrop-filter: blur(10px); border: 1px solid rgba(255, 242, 0, 0.5);
            border-radius: 10px; padding: 20px 30px; box-sizing: border-box; z-index: 20;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        #speaker-name {
            font-family: 'Nanum Myeongjo', serif; font-size: 1.2rem; font-weight: 800;
            color: var(--neon-yellow); margin-bottom: 10px; text-shadow: 0 0 5px var(--neon-yellow);
        }
        #dialogue-text { font-size: 1.15rem; line-height: 1.6; flex-grow: 1; }
        
        #choices-container { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .choice-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--neon-pink);
            color: var(--text-main); padding: 12px; font-size: 1rem; cursor: pointer;
            font-family: inherit; transition: 0.2s; text-align: left; border-radius: 5px;
        }
        .choice-btn:hover { background: rgba(255,0,127,0.2); box-shadow: 0 0 10px var(--neon-pink); }
        .choice-btn.glitch-error {
            color: var(--glitch-red); border-color: var(--glitch-red);
            text-decoration: line-through; pointer-events: none; opacity: 0.6;
            animation: glitch 0.3s infinite;
        }
        @keyframes glitch { 0% { transform: translate(0) } 20% { transform: translate(-2px, 1px) } 40% { transform: translate(-1px, -1px) } 60% { transform: translate(2px, 1px) } 80% { transform: translate(1px, -1px) } 100% { transform: translate(0) } }

        /* 입력창 폼 */
        .input-group { display: flex; gap: 10px; margin-top: 10px; }
        .input-group input { background: transparent; border: 1px solid var(--neon-cyan); color: #fff; padding: 10px; font-size: 1.2rem; font-family: 'Orbitron'; text-align: center; outline: none; }
        .input-group button { background: var(--neon-cyan); color: #000; border: none; font-weight: bold; cursor: pointer; padding: 0 20px; }

        /* 5. 모달창 (상태창, 설정창) */
        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
            width: 400px; background: var(--bg-dark); border: 2px solid var(--neon-cyan);
            padding: 30px; z-index: 50; display: none; opacity: 0; transition: 0.2s;
            box-shadow: 0 0 20px var(--neon-cyan); border-radius: 10px;
        }
        .modal.open { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .modal h2 { font-family: 'Nanum Myeongjo', serif; color: var(--neon-cyan); border-bottom: 1px dashed #555; padding-bottom: 10px; margin-top: 0; }
        .stat-line { display: flex; justify-content: space-between; margin: 15px 0; font-size: 1.1rem; }
        .stat-val { font-family: 'Orbitron', sans-serif; color: var(--neon-yellow); font-weight: bold; }
        
        /* 6. 씬 전환 (검은 화면) */
        #transition-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100; display: flex; flex-direction: column;
            align-items: center; justify-content: center; pointer-events: none;
            opacity: 1; transition: opacity 1s ease-in-out;
        }
        #transition-screen h1 { font-family: 'Nanum Myeongjo', serif; color: #fff; font-size: 3rem; margin: 0; }
        #transition-screen p { color: var(--neon-pink); font-size: 1.2rem; margin-top: 10px; }

        /* 효과음 시각화 */
        .screen-shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        .screen-red { background-color: rgba(255,0,0,0.3) !important; mix-blend-mode: multiply; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }

        .hint { position: absolute; top: 60px; right: 20px; color: #aaa; font-size: 0.9rem; z-index: 10; text-align: right; }
    </style>
</head>
<body>

    <div id="bg-layer"></div>
    
    <header id="header">
        <h1>잭과 콩나무 - 어비스 제로</h1>
    </header>

    <div class="hint">[Tab] 상태창 &nbsp; | &nbsp; [Esc] 설정창<br>클릭 또는 스페이스바로 대사 넘기기</div>

    <div id="char-layer">
        </div>

    <div id="dialogue-layer">
        <div id="speaker-name"></div>
        <div id="dialogue-text"></div>
        <div id="choices-container"></div>
    </div>

    <div id="status-modal" class="modal">
        <h2>호패 (상태 정보)</h2>
        <div class="stat-line"><span>신용 점수 ($C)</span> <span class="stat-val" id="val-c">95</span></div>
        <div class="stat-line"><span>인간성 ($H)</span> <span class="stat-val" id="val-h">70</span></div>
        <div class="stat-line"><span>동기화율 ($S)</span> <span class="stat-val" id="val-s">80</span></div>
        <div class="stat-line"><span>산소 농도 ($O)</span> <span class="stat-val" id="val-o">100%</span></div>
        <div class="stat-line"><span>엽전</span> <span class="stat-val" id="val-m">0전</span></div>
    </div>

    <div id="settings-modal" class="modal">
        <h2>설정</h2>
        <div class="stat-line"><span>텍스트 속도</span> <input type="range" id="text-speed" min="10" max="100" value="30"></div>
        <p style="font-size:0.9rem; color:#888;">*오디오 볼륨 조절 기능 대기 중...</p>
    </div>

    <div id="transition-screen">
        <h1 id="ts-title"></h1>
        <p id="ts-subtitle"></p>
    </div>

<script>
    /* =========================================
       1. 코어 상태 관리
    ========================================= */
    let state = { C: 95, H: 70, S: 80, O: 100, money: 0, manipulation: 0 };
    let currentSceneId = null;
    let currentSequenceIndex = 0;
    let isTyping = false;
    let typeInterval = null;
    let typingSpeed = 30; // ms

    /* =========================================
       2. 이미지 매핑
    ========================================= */
    const images = {
        "셀레스티얼 전경": "셀레스티얼_신_전경.png",
        "셀레스티얼 복도": "셀레스티얼_복도.png",
        "어비스 제로 전경": "어비스_거리.png",
        "폐기물 처리장": "어비스_폐기물처리장.png",
        "구형 중앙 제어 장치": "구형 중앙 제어 장치.png",
        "상인의 집": "상인의집.png",
        "중층부 거리": "어비스_거리.png", // 대체
        "중층부 데이터 센터": "중층부 데이터 센터.png",
        "우주 엘리베이터 내부": "우주 엘레베이터.png",
        "셀레스티얼 입구": "셀레스티얼_입구.png",
        "셀레스티얼 내부": "셀레스티얼_복도.png", // 대체
        "셀레스티얼 관리자석": "셀레스티얼_관리자석.png",
        "새로운 셀레스티얼": "셀레스티얼_신_전경.png",
        "검은 화면": ""
    };

    /* =========================================
       3. 씬(Scene) 데이터 베이스
    ========================================= */
    const scenes = {
        "S1": {
            num: "S1", name: "추락: 에이스의 말로",
            seq: [
                { speaker: "나레이션", text: "찬란한 하늘의 초호화 도시 '셀레스티얼'", bg: "셀레스티얼 전경" },
                { speaker: "커스터디언", text: "놓치면 안된다 잡아라!! 1, 4분대 아래층에서 대기! 3분대는 반대로 돌아서 몰아라! 2분대는 나를 따라 상급 관리자 ‘잭’을 뒤쫓는다!", bg: "셀레스티얼 복도", chars: ["커스터디언"], effect: "shake" },
                { speaker: "잭", text: "이게 도대체 무슨 일인가..", chars: ["잭", "커스터디언"] },
                { speaker: "커스터디언", text: "중앙 데이터 탈취범 ‘잭’ 생포 완료. 신용 등급 말소 및 셀레스티얼 추방을 진행합니다." },
            ],
            choices: [
                { text: "이거 왜 이러십니까! 저는 아무것도 하지 않았습니다!", effect: {H: 5}, next: "S1_END_A" },
                { text: "(격하게 발버둥을 치며 저항한다)", effect: {H: -10}, next: "S1_END_B" },
                { text: "당신들 누구야! 책임자 불러와! 너네 내가 누군지 알아!", effect: {H: -20}, next: "S1_END_C" }
            ]
        },
        "S1_END_A": { seq: [{ speaker: "나레이션", text: "억울함을 호소하지만 받아들여지지 않는다." }, { speaker: "커스터디언", text: "이미 모든 죄가 밝혀졌습니다. 발버둥쳐도 빠져나갈 수 없습니다." }, { speaker: "시스템", text: "추락을 시작합니다.", bg: "검은 화면", effect: "drop", setC: 0 }], nextAuto: "S2" },
        "S1_END_B": { seq: [{ speaker: "나레이션", text: "강제로 제압당한다." }, { speaker: "커스터디언", text: "이미 모든 죄가 밝혀졌습니다. 발버둥쳐도 빠져나갈 수 없습니다." }, { speaker: "시스템", text: "추락을 시작합니다.", bg: "검은 화면", effect: "drop", setC: 0 }], nextAuto: "S2" },
        "S1_END_C": { seq: [{ speaker: "커스터디언", text: "저희는 오로지 이사회의 명령을 통해 움직이는 군단입니다. 이미 모든 죄가 밝혀졌습니다." }, { speaker: "시스템", text: "추락을 시작합니다.", bg: "검은 화면", effect: "drop", setC: 0 }], nextAuto: "S2" },

        "S2": {
            num: "S2", name: "최하층: 질식의 거리",
            seq: [
                { speaker: "나레이션", text: "빛조차 닿지 않는 최하층, ‘어비스 제로’. 악취와 낮은 산소 농도로 숨조차 쉬기 어렵다.", bg: "어비스 제로 전경", setO: 30 },
                { speaker: "잭", text: "(거친 숨소리) ..여긴.. 어디지..? 목이.. 숨을 못 쉬겠어..", bg: "폐기물 처리장", chars: ["잭"], effect: "shake" },
                { speaker: "나레이션", text: "신용 등급 말소. 자가 중앙 제어 장치는 그를 죽여야 했으나, 추락의 충격으로 시스템이 망가져 가까스로 목숨을 구했다. 하지만 고치지 않으면 서서히 죽어갈 것이다." },
                { speaker: "잭", text: "(목 뒤를 움켜쥐며) ….안돼.. 여기서 끝낼 수 없어." },
                { speaker: "나레이션", text: "잭은 쓰레기 더미 속에서 낡은 중앙 제어 장치를 발견한다.", bg: "구형 중앙 제어 장치" },
                { speaker: "잭", text: "(떨리는 손으로) …이걸… 고치면… 아직… 살 수 있다…" },
                { speaker: "나레이션", text: "반파된 신체와 불안정한 호흡 속에서, 그는 생명을 연장하기 위해 직접 수리를 시작한다." }
            ],
            choices: [
                { text: "붉은 케이블을 연결한다", effect: {}, next: "S2_FAIL" },
                { text: "푸른 케이블을 연결한다", effect: {}, next: "S2_STEP2" }
            ]
        },
        "S2_FAIL": { seq: [{ speaker: "시스템", text: "전류 과부하 및 오류 발생. 시스템 재부팅." }], nextAuto: "S2" },
        "S2_STEP2": {
            seq: [{ speaker: "시스템", text: "안정적인 전원 공급. 회로판 정렬 단계로 진입합니다." }],
            choices: [
                { text: "회로판을 시계 방향으로 돌린다", effect: {}, next: "S2_FAIL" },
                { text: "회로판을 반시계 방향으로 돌린다", effect: {}, next: "S2_STEP3" }
            ]
        },
        "S2_STEP3": {
            seq: [{ speaker: "시스템", text: "회로 안정화. 무작위 보안 코드를 입력하십시오." }],
            minigame: "PIN", nextSuccess: "S3", nextFail: "S2"
        },

        "S3": {
            num: "S3", name: "조력자: 뜻밖의 조우",
            seq: [
                { speaker: "나레이션", text: "잭은 어느 따뜻하고 포근한 방 안, 침대 위에서 눈을 떴다.", bg: "상인의 집", setO: 100 },
                { speaker: "상인", text: "물 좀 마셔. 마침 내가 그곳을 지나가던 중이라 다행이지. 아니었다면 죽었을거야.", chars: ["잭", "상인"] }
            ],
            choices: [
                { text: "…당신은 누구죠? 왜 저를 살려주신 겁니까?", effect: {H: 5, C: 10}, next: "S3_A" },
                { text: "..당신 누구야. 꿍꿍이가 대체 뭔가!", effect: {H: -10}, next: "S3_B" },
                { text: "(대답하지 않고 물을 받아 마신다.)", effect: {H: -5}, next: "S3_C" }
            ]
        },
        "S3_A": { seq: [{ speaker: "나레이션", text: "감사와 의문을 표하자 상인이 웃으며 대답한다." }], nextAuto: "S3_MID" },
        "S3_B": { seq: [{ speaker: "나레이션", text: "호의에 적의로 대답하는것을 보고 상인은 살짝 인상을 찌푸리며 대답한다." }], nextAuto: "S3_MID" },
        "S3_C": { seq: [{ speaker: "상인", text: "경계심이 많군." }], nextAuto: "S3_MID" },
        "S3_MID": {
            seq: [
                { speaker: "상인", text: "네 얼굴을 보자마자 알 수 있었어. (구) 상급 관리자 ‘잭’. 현재는 대규모 데이터 탈취란 누명을 쓰고 죽었지. 위에서는 그렇게 알고 있을거야." },
                { speaker: "상인", text: "자네를 다시 셀레스티얼로 갈 수 있도록 도와줄 사람을 소개하지. 우리 팀의 브레인, ‘스카이’다.", chars: ["잭", "상인", "스카이"] },
                { speaker: "스카이", text: "당신이 잭이군. 나는 오래 전부터 상층부를 의심해왔어. 당신을 셀레스티얼로 보내는데 협력할테니, 당신도 나를 도와줘야겠어." }
            ],
            choices: [
                { text: "(화들짝 놀라며)…상층부를 의심한다고요?", effect: {C: 30}, next: "S3_D" },
                { text: "저는 그런 터무니없는 음모론 따위에 휘말리지 않습니다.", effect: {H: -10}, next: "S3_E" }
            ]
        },
        "S3_D": { seq: [{ speaker: "스카이", text: "그래. 그곳은 겉으로는 찬란하지만, 내부는 부패했어. 증명해줘." }], nextAuto: "S3_END" },
        "S3_E": { seq: [{ speaker: "스카이", text: "현실을 부정하는군. 올라가서 직접 두 눈으로 확인해 봐." }], nextAuto: "S3_END" },
        "S3_END": {
            seq: [

    /* =========================================

    ========================================= */

    function updateHUD() {
        document.getElementById('val-c').innerText = state.C;
        document.getElementById('val-h').innerText = state.H;
        document.getElementById('val-s').innerText = state.S;
        document.getElementById('val-o').innerText = state.O + '%';
        document.getElementById('val-m').innerText = state.money.toLocaleString() + '전';
    }

    // 배열 셔플 (선택지 랜덤 배치용)
    function shuffleArray(array) {
        let curId = array.length;
        while (0 !== curId) {
            let randId = Math.floor(Math.random() * curId);
            curId -= 1;
            let tmp = array[curId];
            array[curId] = array[randId];
            array[randId] = tmp;
        }
        return array;
    }

    // 대사 타이핑 효과
    function typeText(element, text, callback) {
        clearInterval(typeInterval);
        element.innerHTML = "";
        isTyping = true;
        let i = 0;
        typeInterval = setInterval(() => {
            element.innerHTML += text.charAt(i);
            i++;
            if (i >= text.length) {
                clearInterval(typeInterval);
                isTyping = false;
                if(callback) callback();
            }
        }, typingSpeed);
    }

    function completeTyping(element, text) {
        clearInterval(typeInterval);
        element.innerHTML = text;
        isTyping = false;
    }

    // 씬 전환 애니메이션
    function transitionScene(num, title, callback) {
        const ts = document.getElementById('transition-screen');
        document.getElementById('ts-title').innerText = num;
        document.getElementById('ts-subtitle').innerText = title;
        ts.style.opacity = 1;
        setTimeout(() => {
            callback();
            ts.style.opacity = 0;
        }, 1500);
    }

    // 캐릭터 렌더링 플레이스홀더
    function renderCharacters(charArr, currentSpeaker) {
        const layer = document.getElementById('char-layer');
        layer.innerHTML = "";
        if(!charArr) return;
        charArr.forEach(c => {
            const div = document.createElement('div');
            div.className = 'character-bust ' + (c === currentSpeaker || currentSpeaker === "시스템" ? 'active' : 'dimmed');
            div.innerText = c;
            layer.appendChild(div);
        });
    }

    function playScene(id) {
        const scene = scenes[id];
        currentSceneId = id;
        currentSequenceIndex = 0;

        // 특수 다이나믹 씬 라우팅
        if(scene.dynamic === "S5_CHECK") {
            if(state.C >= 90) return playScene("S5_PASS");
            else return playScene("S5_BLOCK");
        }
        if(scene.dynamic === "S6_GAME_1") {
            state.manipulation = 0; // 조작율 초기화
        }

        // 트랜지션 여부 확인
        if (scene.num) {
            transitionScene(scene.num, scene.name, () => {
                renderSequence(scene.seq[0]);
            });
        } else {
            renderSequence(scene.seq[0]);
        }
    }

    function renderSequence(seq) {
        const textBox = document.getElementById('dialogue-text');
        const nameBox = document.getElementById('speaker-name');
        const choicesBox = document.getElementById('choices-container');
        const bgLayer = document.getElementById('bg-layer');

        choicesBox.innerHTML = ""; // 선택지 숨김
        
        if(seq.bg) {
            if(seq.bg === "검은 화면") bgLayer.style.backgroundImage = "none";
            else if(images[seq.bg]) bgLayer.style.backgroundImage = `url('${images[seq.bg]}')`;
        }
        
        if(seq.setO !== undefined) state.O = seq.setO;
        if(seq.setC !== undefined) state.C = seq.setC;
        if(seq.setC_add !== undefined) state.C += seq.setC_add;
        if(seq.effect === "syncUp") state.S += 10;
        if(seq.effect === "moneyUp") { state.money += 200000; state.C -= 10; }
        updateHUD();

        // 효과 처리
        document.body.className = "";
        if(seq.effect === "shake") document.body.classList.add("screen-shake");
        if(seq.effect === "red" || seq.effect === "darken") document.body.classList.add("screen-red");

        nameBox.innerText = seq.speaker;
        renderCharacters(seq.chars || scenes[currentSceneId].seq[0].chars, seq.speaker);
        typeText(textBox, seq.text);
    }

    function nextAction() {
        if (isTyping) {
            const seq = scenes[currentSceneId].seq[currentSequenceIndex];
            completeTyping(document.getElementById('dialogue-text'), seq.text);
            return;
        }

        const scene = scenes[currentSceneId];
        currentSequenceIndex++;

        if (currentSequenceIndex < scene.seq.length) {
            renderSequence(scene.seq[currentSequenceIndex]);
        } else {
            // 대사 끝 -> 미니게임, 선택지, 자동 다음 씬 처리
            if(scene.minigame === "PIN") {
                showPinMinigame(scene);
            } else if (scene.choices) {
                showChoices(scene.choices);
            } else if (scene.nextAuto) {
                playScene(scene.nextAuto);
            } else if (currentSceneId === "S6_EVAL") {
                // S6 미니게임 결과 평가
                if(state.manipulation >= 70) playScene("S7");
                else { alert("데이터 조작율 부족. 다시 시도합니다."); playScene("S6_Q1"); }
            }
        }
    }

    function showChoices(choicesData) {
        const choicesBox = document.getElementById('choices-container');
        choicesBox.innerHTML = "";
        
        let shuffled = shuffleArray([...choicesData]); // 복사 후 셔플

        shuffled.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = c.text;

            // H 수치 제한 기믹
            if(c.reqH && state.H < c.reqH) {
                btn.classList.add('glitch-error');
                btn.innerText = "[선택지 오류] " + c.text;
            }

            btn.onclick = () => {
                // 이펙트 적용
                if(c.effect.reset) {
                    state = { C: 95, H: 70, S: 80, O: 100, money: 0, manipulation: 0 };
                } else {
                    if(c.effect.H) state.H += c.effect.H;
                    if(c.effect.C) state.C += c.effect.C;
                    if(c.effect.C_set) state.C = c.effect.C_set;
                    if(c.effect.M) state.manipulation += c.effect.M;
                    if(c.effect.Money) state.money += c.effect.Money;
                }
                updateHUD();
                playScene(c.next);
            };
            choicesBox.appendChild(btn);
        });
    }

    // 4자리 암호 미니게임
    function showPinMinigame(scene) {
        const choicesBox = document.getElementById('choices-container');
        choicesBox.innerHTML = "";
        
        const pin = Math.floor(1000 + Math.random() * 9000).toString();
        const hint = document.createElement('div');
        hint.style.color = "var(--neon-cyan)";
        hint.innerText = `[시스템 권한 우회 핀 코드: ${pin}]`;
        
        const group = document.createElement('div');
        group.className = 'input-group';
        
        const input = document.createElement('input');
        input.type = 'text'; input.maxLength = 4;
        
        const btn = document.createElement('button');
        btn.innerText = "접속";
        
        btn.onclick = () => {
            if(input.value === pin) {
                state.C += 50; state.S += 10;
                updateHUD();
                playScene(scene.nextSuccess);
            } else {
                playScene(scene.nextFail);
            }
        };

        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') btn.click(); });

        group.appendChild(input);
        group.appendChild(btn);
        choicesBox.appendChild(hint);
        choicesBox.appendChild(group);
        setTimeout(() => input.focus(), 100);
    }

    // 이벤트 리스너
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
            e.preventDefault();
            document.getElementById('status-modal').classList.toggle('open');
            document.getElementById('settings-modal').classList.remove('open');
            updateHUD();
        }
        if (e.key === 'Escape') {
            e.preventDefault();
            document.getElementById('settings-modal').classList.toggle('open');
            document.getElementById('status-modal').classList.remove('open');
        }
        if (e.code === 'Space') {
            e.preventDefault();
            if(document.getElementById('choices-container').innerHTML === "") nextAction();
        }
    });

    document.getElementById('dialogue-layer').addEventListener('click', () => {
        if(document.getElementById('choices-container').innerHTML === "") nextAction();
    });

    document.getElementById('text-speed').addEventListener('input', (e) => {
        typingSpeed = 110 - e.target.value; // 반비례
    });

    // 시작
    window.onload = () => {
        updateHUD();
        playScene("S1");
    };
</script>
</body>
</html>
