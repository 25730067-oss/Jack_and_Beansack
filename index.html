<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abyss Zero</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    font-family:'Malgun Gothic', sans-serif;
    background:black;
    color:white;
}

/* 배경 */

#background{
    position:fixed;
    inset:0;
    z-index:0;
}

#background img,
#background video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* 상태바 */

#statusBar{
    position:absolute;
    top:0;
    left:0;
    width:100%;

    padding:15px;

    background:rgba(0,0,0,.4);
    backdrop-filter:blur(10px);

    z-index:10;

    display:flex;
    flex-direction:column;
    align-items:center;
}

#sceneTitle{
    font-size:24px;
    font-weight:bold;

    margin-bottom:15px;

    text-align:center;
}

.stats{
    display:flex;
    gap:20px;
    align-items:center;
    margin-bottom:10px;
}

.stat{
    display:flex;
    align-items:center;
    gap:8px;
}

.gauge{
    width:140px;
    height:12px;

    border:1px solid white;
    border-radius:20px;

    overflow:hidden;
}

.fill{
    height:100%;
    width:50%;

    background:#ffe600;

    transition:.5s;
}

#money{
    font-size:18px;
}

/* 멀티 UI */

#uiLayer{
    position:absolute;
    bottom:180px;
    left:50%;
    transform:translateX(-50%);

    width:80%;
    min-height:120px;

    z-index:20;
}

/* 대사창 */

#dialogueBox{
    position:absolute;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    width:75%;
    height:160px;

    background:rgba(255,255,0,.15);

    backdrop-filter:blur(10px);

    border:2px solid #ffe600;

    padding:10px 15px;

    z-index:30;
}

#speaker{
    font-size:20px;
    font-weight:bold;
    color:#ffe600;

    margin-bottom:10px;
}

#dialogue{
    line-height:1.6;
}

</style>
</head>
<body>

<div id="background">
    <img src="./background/셀레스티얼_복도.png">
</div>

<header id="statusBar">

    <div id="sceneTitle">
        추락 : 에이스의 말로
    </div>

<div class="stats">

    <div class="stat">
        H (50)
        <div class="gauge">
            <div class="fill" style="width:50%"></div>
        </div>
    </div>

    <div class="stat">
        C (95)
        <div class="gauge">
            <div class="fill" style="width:95%"></div>
        </div>
    </div>

    <div class="stat">
        O (100)
        <div class="gauge">
            <div class="fill" style="width:100%"></div>
        </div>
    </div>

    <div class="stat">
        M (1,000,000 Cr)
    </div>

</div>
</header>

<div id="uiLayer">
</div>

<div id="dialogueBox">

    <div id="speaker"></div>
    <div id="dialogue"></div>

</div>

<script>

const dialogueData = [

    {
        speaker:"나레이션",
        text:"찬란한 하늘의 초호화 도시 셀레스티얼"
    },

    {
        speaker:"커스터디언",
        text:"놓치면 안된다 잡아라!!"
    },

    {
        speaker:"잭",
        text:"이게 도대체 무슨 일인가.."
    },

    {
        speaker:"커스터디언",
        text:"중앙 데이터 탈취범 잭 생포 완료."
    }

];

let currentIndex = 0;

let typing = false;

let typingTimer;

const speakerEl =
    document.getElementById("speaker");

const dialogueEl =
    document.getElementById("dialogue");

function typeWriter(text){

    dialogueEl.textContent = "";

    let i = 0;

    typing = true;

    typingTimer = setInterval(()=>{

        dialogueEl.textContent += text[i];

        i++;

        if(i >= text.length){

            clearInterval(typingTimer);

            typing = false;

        }

    },30);

}

function showDialogue(){

    if(currentIndex >= dialogueData.length){

        speakerEl.textContent = "";

        dialogueEl.textContent =
            "대사 종료";

        return;
    }

    speakerEl.textContent =
        dialogueData[currentIndex].speaker;

    typeWriter(
        dialogueData[currentIndex].text
    );
}

showDialogue();

document.addEventListener("click",()=>{

    if(currentIndex >= dialogueData.length){

        return;
    }

    if(typing){

        clearInterval(typingTimer);

        dialogueEl.textContent =
            dialogueData[currentIndex].text;

        typing = false;

        return;
    }

    currentIndex++;

    showDialogue();

});

</script>

</body>
</html>
